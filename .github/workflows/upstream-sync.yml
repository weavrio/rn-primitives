name: upstream sync

# Auto-PR on an upstream release. Deliberately opens a PR rather than pushing:
# the repackage exists to be a supply-chain control point, and a human reading
# the diff IS the control. Publishing stays a separate, manual step on a green
# merge — never automatic, never on a red gate.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Merge the upstream release and open a review PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the newest upstream release
        id: upstream
        run: |
          git remote add upstream https://github.com/roninoss/rn-primitives.git
          git fetch --tags upstream
          # Upstream tags each package release as `<pkg>@<version>`; the version
          # this fork mirrors is the one on `all@*`.
          tag="$(git tag -l 'all@*' | sort -V | tail -1)"
          [ -n "$tag" ] || { echo "::error::no all@* tag found upstream"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#all@}" >> "$GITHUB_OUTPUT"

      - name: Stop if already on this release
        id: check
        run: |
          current="$(node -p "require('./packages/rn-primitives/package.json').version")"
          if [ "$current" = "${{ steps.upstream.outputs.version }}" ]; then
            echo "already on ${current} — nothing to do"
            echo "up-to-date=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the upstream release and bump the mirrored version
        if: steps.check.outputs.up-to-date != 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          git config user.name  "weavr-bot"
          git config user.email "noreply@weavr.io"
          git checkout -b "upstream-sync/$VERSION"
          git merge --no-edit "$TAG"
          node -e "
            const fs = require('node:fs');
            const path = 'packages/rn-primitives/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "
          git commit -am "chore: sync upstream $TAG"
          git push origin "upstream-sync/$VERSION"

      # `gh` is preinstalled on GitHub-hosted runners, so opening the PR needs no
      # third-party action.
      #
      # The body is assembled into a file rather than passed inline: a heredoc
      # nested inside `--body "$(cat <<EOF ...)"` inside a YAML block scalar has
      # to keep three levels of indentation and quoting in agreement, and gets
      # silently wrong (an over-indented terminator never closes the heredoc).
      # `echo` handles the one interpolated line; a quoted heredoc keeps the
      # markdown literal so backticks are not command substitution.
      - name: Open the review PR
        if: steps.check.outputs.up-to-date != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.upstream.outputs.version }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          branch="upstream-sync/$VERSION"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR for $branch already open — leaving it alone"
            exit 0
          fi

          {
            echo "Automated sync of upstream \`$TAG\`."
            echo
            cat <<'BODY'
          **This PR is the supply-chain review gate.** Before merging, read:

          - the upstream source diff — the behaviour changes actually reaching weavr;
          - `packages/rn-primitives/package.json` — the regenerated `exports` map and
            dependency set. A new public subpath or a new transitive dependency shows
            up here first.

          CI gates this PR on the upstream build, the relocation contract (including
          byte parity against upstream's own build) and the consumer-surface typecheck.

          If upstream added a primitive, the pinned-surface test in `repackage.test.ts`
          fails **by design** — decide deliberately whether the new primitive becomes
          public, then update the pinned list.

          > NOTE: a PR opened with `GITHUB_TOKEN` does not trigger `on: pull_request`
          > workflows — GitHub blocks recursive runs. Push an empty commit, or close
          > and reopen the PR, to make CI run before merging.
          BODY
          } > /tmp/pr-body.md

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: sync upstream $TAG" \
            --body-file /tmp/pr-body.md
