name: ci

# Gate for the @weavr/rn-primitives repackage. Upstream ships no test suite, so
# the gate is: upstream builds clean -> the relocation contract holds (including
# byte parity against upstream's own build) -> the consumer surface typechecks.
# All three must pass before a publish.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: this workflow only reads source. No write or package scopes.
permissions:
  contents: read

env:
  CI: 'true'

jobs:
  repackage:
    name: build · relocation contract · consumer surface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # mise.toml is the single source of truth for the toolchain, but
      # actions/setup-node cannot read it (it supports .nvmrc, .node-version,
      # .tool-versions and package.json only), so both pins are read out here
      # rather than duplicated into a second file that could drift.
      - name: Resolve the toolchain from mise.toml and package.json
        id: toolchain
        run: |
          node_version="$(sed -nE 's/^node = "([^"]+)"/\1/p' mise.toml)"
          pnpm_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          [ -n "$node_version" ] || { echo "::error::no node pin in mise.toml"; exit 1; }
          [ -n "$pnpm_version" ] || { echo "::error::no packageManager in package.json"; exit 1; }
          echo "node=$node_version"  >> "$GITHUB_OUTPUT"
          echo "pnpm=$pnpm_version"  >> "$GITHUB_OUTPUT"
          echo "Resolved node $node_version, pnpm $pnpm_version"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      # pnpm is installed with npm rather than pnpm/action-setup: this repo is a
      # fork, and GitHub rejects that action here at startup regardless of
      # version ("not allowed in weavrio/rn-primitives") even though the bare
      # `pnpm/action-setup` pattern is in the repo allowlist — a bare
      # `owner/repo` pattern carries no `@version`/`@*` and so matches nothing.
      # GitHub-owned actions are always allowed, so the rest of this workflow is
      # unaffected. The version still comes from `packageManager`, so there is
      # no new source of truth.
      - name: Set up pnpm
        run: npm install -g "pnpm@${{ steps.toolchain.outputs.pnpm }}"

      # Cache the pnpm store by hand — actions/cache is GitHub-owned, so it is
      # allowed where pnpm/action-setup's built-in caching is not.
      - name: Resolve the pnpm store path
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        # --ignore-scripts blocks dep lifecycle scripts (supply-chain hardening).
        # Load-bearing here: this repo exists to be a supply-chain control point,
        # so its own CI must not execute arbitrary postinstall code.
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Builds the 32 upstream packages, then the repackage. Ordering is turbo's:
      # @weavr/rn-primitives declares them all as workspace devDependencies, so
      # `^build` runs them first.
      - name: Build
        run: pnpm build

      # The repackage regenerates exports/dependencies into package.json. A diff
      # here means the committed manifest is stale, so the audit surface would
      # misrepresent what actually ships.
      - name: Fail on an uncommitted manifest change
        run: git diff --exit-code packages/rn-primitives/package.json

      - name: Relocation contract
        run: pnpm --filter @weavr/rn-primitives test

      - name: Consumer-surface typecheck
        run: pnpm --filter @weavr/rn-primitives typecheck
